<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Roman Chess</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1c1d21;
        color: #f1e3c0;
        font-family: system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      #status {
        margin: 0;
        padding: calc(env(safe-area-inset-top) + 12px) 16px 8px;
        text-align: center;
        font-size: 18px;
      }
      #table {
        flex: 1;
        min-height: 0;
        display: flex;
        position: relative; /* Bezug für die Zugliste im Hochformat */
      }
      #board {
        flex: 1;
        min-width: 0;
        touch-action: none; /* kein Scrollen oder Zoomen der Seite beim Wischen übers Brett */
      }
      /* Zugliste: am Rechner rechts neben dem Brett */
      #moves {
        width: 190px;
        overflow-y: auto;
        padding: 8px 10px;
        border-left: 1px solid #3a3b42;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      #moves div {
        display: grid;
        grid-template-columns: 2.6em 1fr 1fr;
      }
      #moves span {
        padding: 1px 4px;
      }
      #moves .last {
        background: rgba(168, 134, 47, 0.5);
        border-radius: 4px;
      }
      #moves:empty::before {
        content: 'Noch keine Züge';
        opacity: 0.6;
      }
      /* Hochkant (iPhone): halbtransparent unten über dem Brett, verdeckt es nicht ganz.
         Tipps gehen durch die Liste hindurch aufs Brett; sie scrollt von selbst ans Ende. */
      @media (orientation: portrait) {
        #moves {
          pointer-events: none;
          position: absolute;
          left: 12px;
          right: 12px;
          bottom: 6px;
          width: auto;
          max-height: 22%;
          border: 1px solid rgba(168, 134, 47, 0.6);
          border-radius: 10px;
          background: rgba(28, 29, 33, 0.7);
        }
      }
      nav {
        display: flex;
        gap: 10px;
        justify-content: center;
        padding: 6px 16px;
      }
      #actions {
        padding-bottom: calc(env(safe-area-inset-bottom) + 14px);
      }
      #views button {
        font-size: 15px;
        padding: 6px 12px;
      }
      button {
        font: inherit;
        font-size: 17px;
        padding: 10px 18px;
        border: 1px solid #a8862f;
        border-radius: 10px;
        background: #2a2b31;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <p id="status"></p>
    <main id="table">
      <div id="board"></div>
      <div id="moves" hidden></div>
    </main>
    <nav id="views">
      <button id="view-standard">Standard</button>
      <button id="view-bird">Vogel</button>
      <button id="toggle-moves">Moves</button>
    </nav>
    <nav id="actions">
      <button id="new-game">Neues Spiel</button>
      <button id="undo">Zug zurück</button>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
